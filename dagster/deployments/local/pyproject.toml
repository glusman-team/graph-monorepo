# Local command environment for dg against the whole workspace.
# `dg dev` / `dg list project` run from here (per-project venvs are separate).
[project]
name = "graph-monorepo-workspace-local"
version = "0.0.0"
requires-python = ">=3.10,<3.15"
dependencies = [
  "dagster==1.13.24",
  "dagster-dg-cli==1.13.24",
  "dagster-webserver==1.13.24",
]
