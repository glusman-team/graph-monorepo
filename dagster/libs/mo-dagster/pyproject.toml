[project]
name = "mo-dagster"
version = "0.1.0"
description = "Shared dagster plumbing: pipes subprocess client wrapper for Go workers. The only lib that imports dagster."
requires-python = ">=3.10,<3.15"
dependencies = [
  "dagster==1.13.28",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mo_dagster"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
