[project]
name = "linkouts-dag"
version = "0.1.0"
description = "Manually triggered Dagster code location for Linkouts KGX ingestion and serving-index publication"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dagster==1.13.28",
  "linkouts-pipeline",
  "mo-dagster",
]

[dependency-groups]
dev = [
  "dagster-dg-cli==1.13.28",
  "dagster-pipes==1.13.28",
  "pytest>=8.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkouts_dag"]

[tool.uv.sources]
linkouts-pipeline = { path = "pipeline", editable = true }
mo-dagster = { path = "../../libs/mo-dagster", editable = true }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "linkouts_dag"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4", "PT", "RUF", "UP", "RET", "PIE"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
