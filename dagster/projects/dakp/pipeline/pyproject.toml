[project]
name = "dakp-pipeline"
version = "0.1.0"
description = "DAKP pipeline core (dagster-free): sources, extractors, assertion shaping, Tablassert handoff"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "ISB" }]
license = { text = "Apache-2.0" }
dependencies = [
  # multi-connection downloads (FAERS / Drugs@FDA); separate process, Apache-2.0 compatible
  "aria2>=0.0.1b0",
  "blake3>=1.0.0",
  "loguru>=0.7.3",
  # calamine engine for the EMA medicines xlsx
  "fastexcel>=0.21.0",
  "polars>=2.0.0rc2,<3",
  "pydantic>=2.12.0",
  # text layer of the EMA SmPC PDFs
  "pypdf>=6.19,<7",
  # Tablassert graph/table config validation (the emitter stays custom; pyyaml
  # validates it round-trips and replaces the fragile graph-stem line scan)
  "pyyaml>=6.0",
  # NER training export (canonical avro schema for the HF dataset split): a production
  # stage, so these are runtime deps, not dev-only.
  "dataclasses-avroschema[pydantic]>=0.71,<1",
  "fastavro>=1.12,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16.0",
]
# Production NER backend (GPU mining): install with `uv sync --group ner`.
# Deliberately NOT in the default groups: torch + gliner2 pull gigabytes and
# the offline/test surface runs without them (lazy imports in ner/ner.py).
ner = [
  # The cu126 wheel line is the LAST with kernels for the P100 build host (sm_60);
  # cu128/cu129 binaries dropped Maxwell/Pascal starting at torch 2.8, and cuDNN >=9.19
  # hard-fails there. Pinned via [tool.uv.sources] to the pytorch cu126 index (mirrors
  # DAKP v1.25.0's pin; a CUDA 12.6 runtime runs fine on the 12.8 driver).
  "torch>=2.8,<2.9",
  "gliner2>=2.1,<3",
  "peft>=0.14",
  "huggingface_hub>=0.34",
  # gliner2's base deps omit transformers; in DAKP it arrived transitively via
  # tablassert[qc] (sentence-transformers). Declared here so the group is complete on its own.
  "transformers>=5,<6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakp_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4", "PT", "RUF", "UP", "RET", "PIE"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
