[project]
name = "dakp-pipeline"
version = "0.1.0"
description = "DAKP pipeline core (dagster-free): sources, extractors, assertion shaping, Tablassert handoff"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "ISB" }]
license = { text = "Apache-2.0" }
dependencies = [
  # multi-connection downloads (FAERS / Drugs@FDA); separate process, Apache-2.0 compatible
  "aria2>=0.0.1b0",
  "blake3>=1.0.0",
  "loguru>=0.7.3",
  # calamine engine for the EMA medicines xlsx
  "fastexcel>=0.21.0",
  "polars>=2.0.0rc2,<3",
  "pydantic>=2.12.0",
  # text layer of the EMA SmPC PDFs
  "pypdf>=6.19,<7",
  # Tablassert graph/table config validation (the emitter stays custom; pyyaml
  # validates it round-trips and replaces the fragile graph-stem line scan)
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.8",
  "ruff>=0.16.0",
  # NER training export (canonical avro schema for the HF dataset split); light
  # deps that the test suite covers, kept here so `uv sync` (dev default) has them
  "dataclasses-avroschema[pydantic]>=0.71,<1",
  "fastavro>=1.12,<2",
]
# Production NER backend (GPU mining): install with `uv sync --group ner`.
# Deliberately NOT in the default groups: torch + gliner2 pull gigabytes and
# the offline/test surface runs without them (lazy imports in ner/ner.py).
ner = [
  "torch>=2.8",
  "gliner2>=2.1,<3",
  "peft>=0.14",
  "huggingface_hub>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakp_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "C4", "PT", "RUF", "UP", "RET", "PIE"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
