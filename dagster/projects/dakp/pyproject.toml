[project]
name = "dakp-dag"
version = "0.1.0"
description = "Dagster code location for the DAKP knowledge graph: asset graph, narrow per-stage jobs, env-driven run config"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dagster==1.13.24",
  "dakp-pipeline",
  "mo-core",
  "mo-kg",
  "mo-dagster",
]

[dependency-groups]
dev = [
  "dagster-dg-cli==1.13.24",
  "pytest>=8.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakp_dag"]

[tool.uv.sources]
dakp-pipeline = { path = "pipeline", editable = true }
mo-core = { path = "../../libs/mo-core", editable = true }
mo-kg = { path = "../../libs/mo-kg", editable = true }
mo-dagster = { path = "../../libs/mo-dagster", editable = true }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dakp_dag"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
