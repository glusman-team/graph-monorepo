[project]
name = "dakp-dag"
version = "0.1.0"
description = "Dagster code location for the DAKP knowledge graph: asset graph, narrow per-stage jobs, env-driven run config"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dagster==1.13.24",
  "dakp-pipeline",
  "mo-core",
  "mo-kg",
  "mo-dagster",
]

[dependency-groups]
dev = [
  "dagster-dg-cli==1.13.24",
  "pytest>=8.0",
  "ruff>=0.16.0",
]
# Production runtime for the code location (the assets mine NER and run the Tablassert CLI
# in-process). NOT in dev: torch + the tablassert qc stack pull gigabytes and CI's python
# job only runs tests. Dependency groups do not propagate across path deps, so this lists
# the pipeline's ner group itself.
ner = [
  # cu126 is the last torch wheel line with sm_60 (P100) kernels; see pipeline/pyproject.toml.
  "torch>=2.8,<2.9",
  "gliner2>=2.1,<3",
  "peft>=0.14",
  "huggingface_hub>=0.34",
  "transformers>=5,<6",
  # The Tablassert CLI + the QC audit runtime (sentence-transformers). Version pinned to the
  # DAKP v1.25.0 reference build so the ported graph builds with the same compiler.
  "tablassert[cli,log,qc]==19.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dakp_dag"]

[tool.uv.sources]
dakp-pipeline = { path = "pipeline", editable = true }
# cu126 is the last torch wheel line with sm_60 (P100) kernels; see the ner group comment.
torch = { index = "pytorch-cu126" }
mo-core = { path = "../../libs/mo-core", editable = true }
mo-kg = { path = "../../libs/mo-kg", editable = true }
mo-dagster = { path = "../../libs/mo-dagster", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dakp_dag"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
