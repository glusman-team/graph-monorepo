# pre-commit: fast formatting and metadata checks.
# pre-push: module-aware tests, lint, locks, workflow, and deployment gates.
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
exclude = '''^dagster/projects/.*/(contracts|fixtures|testdata)/'''

[[repos.hooks]]
id = "end-of-file-fixer"
exclude = '''^dagster/projects/.*/(contracts|fixtures|testdata)/'''

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-json"
exclude = '''^sites/linkouts/assets/tsconfig\.json$'''

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=1024"]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"

[[repos.hooks]]
id = "gitleaks"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
# Keep in sync with the Ruff version resolved in each uv.lock.
rev = "v0.16.0"

[[repos.hooks]]
id = "ruff-check"
language = "python"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"
language = "python"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "go-module-format"
name = "golangci-lint fmt (changed modules)"
entry = "scripts/run-go-format.sh"
language = "system"
files = '''\.go$|(^|/)\.golangci\.yml$'''
pass_filenames = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "mix-module-format"
name = "mix format (changed projects)"
entry = "scripts/run-mix-format.sh"
language = "system"
files = '''^sites/linkouts/.*\.(ex|exs|heex)$'''
pass_filenames = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "docs-format"
name = "Prettier (documentation)"
entry = "npm run docs:format"
language = "system"
files = '''^sites/docs/|^package(-lock)?\.json$'''
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "treefmt"
name = "treefmt"
entry = "treefmt"
language = "system"
types = ["nix"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-locks"
name = "recursive language lock checks"
entry = "scripts/check-locks.sh"
language = "system"
files = '''(^|/)(pyproject\.toml|uv\.lock|go\.mod|go\.sum|package(-lock)?\.json|mix\.exs|mix\.lock)$'''
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "go-module-test-race"
name = "go test -race (changed modules)"
entry = "scripts/run-go-tests.sh"
language = "system"
files = '''\.go$|(^|/)(go\.mod|go\.sum|\.golangci\.yml)$'''
pass_filenames = true
stages = ["pre-push"]

[[repos.hooks]]
id = "nx-affected"
name = "Nx affected test and lint"
entry = "scripts/run-nx-affected.sh"
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "linkouts-dialyzer"
name = "Phoenix Dialyzer"
entry = "make linkouts-dialyzer"
language = "system"
files = '''^sites/linkouts/(mix\.(exs|lock)|lib/|config/|test/)'''
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
entry = "actionlint"
language = "system"
files = '''^\.github/workflows/.*\.ya?ml$'''
pass_filenames = true
stages = ["pre-push"]

[[repos.hooks]]
id = "deploy-config"
name = "Linkouts deployment config"
entry = "python3 sites/linkouts/scripts/check_deploy.py"
language = "system"
files = '''^sites/linkouts/(Dockerfile|fly(\.dev)?\.toml)$|^\.dockerignore$'''
pass_filenames = false
stages = ["pre-push"]

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
entry = "shellcheck"
language = "system"
types = ["shell"]
pass_filenames = true
stages = ["pre-push"]

[[repos.hooks]]
id = "nix-flake-check"
name = "nix flake check"
entry = "nix flake check --no-build --no-warn-dirty"
language = "system"
files = '''\.nix$|flake\.lock$'''
pass_filenames = false
stages = ["pre-push"]
