name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dakp_python: ${{ steps.paths.outputs.dakp_python }}
      dakp_go: ${{ steps.paths.outputs.dakp_go }}
      linkouts_python: ${{ steps.paths.outputs.linkouts_python }}
      linkouts_go: ${{ steps.paths.outputs.linkouts_go }}
      linkouts_web: ${{ steps.paths.outputs.linkouts_web }}
      docs: ${{ steps.paths.outputs.docs }}
      deploy: ${{ steps.paths.outputs.deploy }}
      dagster: ${{ steps.paths.outputs.dagster }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changed components
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > /tmp/changed-files
          else
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > /tmp/changed-files
          fi
          python3 scripts/ci_changes.py --files /tmp/changed-files --github-output "$GITHUB_OUTPUT"

  dakp-python:
    needs: changes
    if: needs.changes.outputs.dakp_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; npm ci; npx nx run-many -t test lint --projects=dakp,dakp-pipeline,mo-core,mo-kg,mo-dagster --parallel=4'

  dakp-go:
    needs: changes
    if: needs.changes.outputs.dakp_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - working-directory: dagster/projects/dakp/workers/go
        run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; go build ./...; go test -race -count=1 ./...; golangci-lint run ./...; golangci-lint fmt --diff ./...; go mod tidy -diff'

  linkouts-python:
    needs: changes
    if: needs.changes.outputs.linkouts_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; npm ci; npx nx run-many -t test lint --projects=linkouts,linkouts-pipeline --parallel=2'

  linkouts-go:
    needs: changes
    if: needs.changes.outputs.linkouts_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - working-directory: dagster/projects/linkouts/workers/go
        run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; go build ./...; go test -race -count=1 ./...; golangci-lint run ./...; golangci-lint fmt --diff ./...; go mod tidy -diff'

  linkouts-web:
    needs: changes
    if: needs.changes.outputs.linkouts_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sites/linkouts/priv/plts
          key: linkouts-plt-${{ runner.os }}-${{ hashFiles('flake.lock', 'sites/linkouts/mix.lock') }}
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; npm ci; (cd sites/linkouts && mix local.hex --force && mix local.rebar --force && mix deps.get --check-locked); npx nx run-many -t test lint dialyzer --projects=linkouts-web --parallel=1'

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; npm ci; npm run docs:verify'

  dagster:
    needs: changes
    if: needs.changes.outputs.dagster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - working-directory: dagster/deployments/local
        run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; (cd ../../projects/dakp && uv sync --locked); (cd ../../projects/linkouts && uv sync --locked); uv sync --locked; uv run dg check defs'

  deploy-build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; python3 sites/linkouts/scripts/check_deploy.py; hadolint sites/linkouts/Dockerfile'
      - env:
          DOCKER_BUILDKIT: "1"
          LINKOUTS_IMAGE: linkouts:ci
        run: |
          set -euo pipefail
          docker build --cpuset-cpus=0-3 -f sites/linkouts/Dockerfile -t "$LINKOUTS_IMAGE" .
          sites/linkouts/scripts/smoke_preview.sh

  repository:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; npm ci; (cd sites/linkouts && mix local.hex --force && mix local.rebar --force && mix deps.get --check-locked); prek run --all-files --hook-stage pre-commit; python3 scripts/test_ci_changes.py; scripts/check-locks.sh; prek run shellcheck --all-files --hook-stage pre-push; actionlint; hadolint sites/linkouts/Dockerfile; python3 sites/linkouts/scripts/check_deploy.py; nix flake check --no-build --no-warn-dirty'

  security:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix develop "$GITHUB_WORKSPACE#deploy" --command bash -c 'set -e; npm ci; (cd dagster/projects/dakp/workers/go && govulncheck ./...); (cd dagster/projects/linkouts/workers/go && govulncheck ./...); (cd sites/linkouts && mix local.hex --force && mix local.rebar --force && mix deps.get --check-locked && mix hex.audit); npm audit'

  ci-required:
    name: CI Required
    if: always()
    needs: [changes, dakp-python, dakp-go, linkouts-python, linkouts-go, linkouts-web, docs, dagster, deploy-build, repository, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every applicable job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          failures = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
              if value["result"] not in {"success", "skipped"}
          }
          if failures:
              raise SystemExit(f"Required CI jobs failed or were cancelled: {failures}")
          print("All applicable CI jobs passed; unrelated scoped jobs were skipped.")
          PY
