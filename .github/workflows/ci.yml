name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref instead of queueing behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One runner, all four packages: each job in the old matrix waited on
  # runner availability separately, and uv's wheel cache is shared within
  # a runner, so sequential sync+test of small packages costs ~1-2 min total.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: sync + test
        run: |
          set -e
          # nested globs cover packages inside a project (e.g. projects/dakp/pipeline);
          # dirs without a pyproject.toml are skipped by the guard.
          for dir in dagster/libs/*/ dagster/projects/*/ dagster/projects/*/*/; do
            [ -f "$dir/pyproject.toml" ] || continue
            echo "::group::uv lock --check: $dir"
            (cd "$dir" && uv lock --check)
            echo "::group::pytest: $dir"
            (cd "$dir" && uv sync --group dev --quiet && uv run pytest -q)
            echo "::endgroup::"
          done
      - name: dg check defs (every code location loads)
        run: |
          cd dagster/deployments/local
          uv sync --quiet
          uv run dg check defs

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: dagster/projects/dakp/workers/go/go.mod
          cache-dependency-path: dagster/projects/dakp/workers/go/go.sum
      - name: build + test
        run: |
          go build ./...
          go test ./...
        working-directory: dagster/projects/dakp/workers/go
      - name: lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v1 binaries are built with go1.24 and refuse go 1.26 targets.
          # Pin the v2 line (matches the devshell toolchain) instead of the
          # action's default v1.
          version: v2.14.0
          working-directory: dagster/projects/dakp/workers/go

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix flake check --no-build --no-warn-dirty
