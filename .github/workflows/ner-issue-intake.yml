name: DAKP NER issue intake

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read

jobs:
  stage:
    if: startsWith(github.event.issue.title, '[DAKP NER]:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dagster/projects/dakp/pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Validate and stage issue cases
        run: >-
          uv run --locked --no-dev python tests/eval/ner_intake.py issue
          --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/ner-gold-candidates.ndjson"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ner-gold-issue-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/ner-gold-candidates.ndjson
          if-no-files-found: error
